name: Publish the reviewed Lesta bridge source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-lesta-bridge.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == '136084599/DG-Lab-Coyote-Game-Hub-WOWS-Lesta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: lesta-2026.11.19-r2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package and publish the verified bridge
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          test "$(git rev-parse HEAD:lesta-bridge)" = '07d2b5ea5940917b025f2ddad8ef2980864ce69a'
          git archive --format=zip --prefix=lesta-bridge/ HEAD:lesta-bridge > lesta-coyote-bridge-source.zip
          sha256sum lesta-coyote-bridge-source.zip > SHA256SUMS.txt
          gh release create "$TAG" lesta-coyote-bridge-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest --title '莱服郊狼桥接 · Windows 快速启动与使用手册' --notes-file - <<'NOTES'
          下载 `lesta-coyote-bridge-source.zip` 后先解压。此版带 Windows 启动器和按功能写的完整手册。启动器会复用目录中的 `python_env` 或 `.venv`，也可使用系统 Python。
          
          - **离线模拟**需要 Python 3.13+ 与桥接依赖。按包内 README 复制示例配置并运行 `start.bat --dry-run`，默认只监听本机，示例输出上限为 0。
          - **真实联动**需要独立运行的兼容 Hub，已有 Hub 可复用。波形补丁只适用于脚本通过验证的 Hub 1.5.0 构建。
          - **使用手册**覆盖游戏采集、事件规则、波形库、配置方案、调参实验室、OBS 和故障诊断。
          
          [完整使用教程](https://github.com/136084599/DG-Lab-Coyote-Game-Hub-WOWS-Lesta/blob/main/lesta-bridge/README.md)
          NOTES
